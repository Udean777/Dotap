name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (calculated from latest git tag)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version string (only if bump_type is custom, e.g., 0.2.0)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: version
        env:
          PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          CUSTOM_INPUT="${{ github.event.inputs.custom_version }}"

          echo "Latest tag found: '$LATEST_TAG'"
          echo "Selected bump type: '$BUMP_TYPE'"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            REF_TAG="${{ github.ref_name }}"
            CLEAN_VERSION="${REF_TAG#v}"
          elif [ "$BUMP_TYPE" = "custom" ] && [ -n "$CUSTOM_INPUT" ]; then
            CLEAN_VERSION="${CUSTOM_INPUT#v}"
          elif [ -z "$LATEST_TAG" ]; then
            CLEAN_VERSION="0.1.0"
          else
            CLEAN="${LATEST_TAG#v}"
            IFS="." read -r MAJOR MINOR PATCH <<< "$CLEAN"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-1}
            PATCH=${PATCH:-0}

            case "$BUMP_TYPE" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              *)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
            esac
            CLEAN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${CLEAN_VERSION}"

          # If triggered via workflow_dispatch, verify tag does not exist already
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release tag ${TAG_NAME} already exists!"
              exit 1
            fi
          fi

          VERSION_BASE="${PLAY_VERSION_CODE_BASE:-0}"
          if ! [[ "$VERSION_BASE" =~ ^[0-9]+$ ]]; then
            VERSION_BASE=0
          fi
          VERSION_CODE=$((10#$VERSION_BASE + WORKFLOW_RUN_NUMBER))

          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          echo "Target Version Name: ${CLEAN_VERSION}"
          echo "Target Version Code: ${VERSION_CODE}"
          echo "Target Tag Name:     ${TAG_NAME}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystores
          KEYSTORE_PATH="${{ github.workspace }}/keystores/dotap-release.keystore"

          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using production signing credentials from repository secrets."
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

            echo "keystore_file=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "keystore_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "is_ci_generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 or passwords not configured in secrets. Generating self-signed release keystore for CI artifact..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias dotap \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Dotap CI, O=Dotap, C=US"

            echo "keystore_file=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "keystore_password=android" >> "$GITHUB_OUTPUT"
            echo "key_alias=dotap" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
            echo "is_ci_generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Quality Verification
        run: ./gradlew spotlessCheck detekt testDebugUnitTest lintDebug --no-daemon

      - name: Build Signed AAB and Release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Verify Release Signatures and Alignment
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk

          if [ ! -s "$AAB" ]; then
            echo "AAB is missing or empty: $AAB"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "APK is missing or empty: $APK"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          if [ ! -x "$APKSIGNER" ] || [ ! -x "$ZIPALIGN" ]; then
            echo "Android SDK build tools (apksigner/zipalign) not found."
            exit 1
          fi

          echo "Verifying AAB JAR signature..."
          jarsigner -verify -certs "$AAB" >/dev/null

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "Checking APK alignment..."
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")
          echo "Release APK size: ${APK_SIZE} bytes"
          if [ "$APK_SIZE" -gt 15000000 ]; then
            echo "Release APK size exceeded 15MB: ${APK_SIZE} bytes"
            exit 1
          fi

          mkdir -p dist
          cp "$AAB" "dist/Dotap-v${VERSION_NAME}-${VERSION_CODE}.aab"
          cp "$APK" "dist/Dotap-v${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$APK" "dist/Dotap-latest.apk"
          sha256sum dist/*.aab dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Push Git Tag
        if: startsWith(github.ref, 'refs/tags/v') != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.tag_name }}"
          git push origin "${{ steps.version.outputs.tag_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Dotap ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          body: |
            Release **${{ steps.version.outputs.tag_name }}** (`versionCode`: ${{ steps.version.outputs.version_code }})

            ### Downloads & Artifacts
            - **`Dotap-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk`**: Standalone sideload APK
            - **`Dotap-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.aab`**: Android App Bundle for Google Play Console
            - **`Dotap-latest.apk`**: Always links to the latest version APK
            - **`SHA256SUMS.txt`**: Cryptographic verification checksums

            > ${{ steps.keystore.outputs.is_ci_generated == 'true' && '⚠️ *Note: Built with CI-generated self-signed key. Set `SIGNING_KEYSTORE_BASE64` and keystore secrets in repo settings for production Play Store keys.*' || '✅ *Verified release artifact signed with official repository release key.*' }}
          files: dist/*
